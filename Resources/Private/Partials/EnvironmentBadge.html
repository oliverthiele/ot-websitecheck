<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>The environment of a sitemap snapshot; renders nothing without one.</f:comment>
<f:if condition="{environment}">
    <f:variable name="badgeStates" value="{live: 'primary', staging: 'notice', development: 'secondary', local: 'secondary'}"/>
    <span class="badge badge-{badgeStates.{environment}}">{f:translate(key: 'LLL:EXT:ot_websitecheck/Resources/Private/Language/locallang.xlf:environment.{environment}')}</span>
</f:if>

</html>
